name: armpicom_srp_checker

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'armpicom/**/*.py'
      - 'setup.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'armpicom/**/*.py'
      - 'setup.py'

jobs:
  srp_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check Single Responsibility Principle violations
        run: |
          python3 gates/gates/srp_checker.py armpicom
